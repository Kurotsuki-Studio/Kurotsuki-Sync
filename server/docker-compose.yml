version: '3.8'

services:
  kurotsuki-relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kurotsuki-sync-relay
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - STORAGE_DIR=/data
      - AUTH_TOKEN=${AUTH_TOKEN:-change-me-to-a-secure-secret}
      - MAX_PAYLOAD_MB=50
      - CORS_ENABLED=true
    volumes:
      - ./data:/data

  # Optional: Automatic SSL Reverse Proxy with Caddy
